services:
  db:
    image: postgis/postgis:16-3.4
    env_file:
      - /etc/domain-map/db.env
    volumes:
      - domain_map_pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${DOMAIN_MAP_APP_IMAGE:?DOMAIN_MAP_APP_IMAGE is required}
    pull_policy: never
    env_file:
      - /etc/domain-map/db.env
      - /etc/domain-map/app.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - private
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    image: ${DOMAIN_MAP_MIGRATE_IMAGE:?DOMAIN_MAP_MIGRATE_IMAGE is required}
    pull_policy: never
    env_file:
      - /etc/domain-map/db.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    profiles:
      - ops
    restart: "no"

volumes:
  domain_map_pgdata:

networks:
  private:
    driver: bridge
    internal: true
  edge:
    driver: bridge
