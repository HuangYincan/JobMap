[project]
name = "domain-map-importer"
version = "0.1.0"
description = "Deterministic local fixture importer seams for Domain Map"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
