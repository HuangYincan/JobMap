name: Documentation Policy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  docs-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical documentation references
        run: make docs-check
      - name: Report scaffold state
        run: make scaffold-status

# Application lint, migration, unit, integration, E2E, accessibility, security, and
# coverage jobs are added with their manifests and executable test suites in Phase 1+
# rather than claiming to validate artifacts that do not yet exist.
